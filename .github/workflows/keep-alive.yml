name: Keep Supabase awake

# Free-tier Supabase projects pause after 7 days without activity. This runs a
# tiny read twice a week so the database never sits idle that long. RLS hides
# every row from the anon key, so it returns [] — but the query still reaches
# Postgres, which is what counts as activity.
on:
  schedule:
    - cron: '17 6 * * 1,4' # Mon + Thu, 06:17 UTC
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query the database
        env:
          SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: |
          curl --fail --silent --show-error --retry 3 --retry-delay 10 \
            "$SUPABASE_URL/rest/v1/schema_migrations?select=version&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY"
